name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) is the only trigger. There is no
# workflow_dispatch: a dispatch runs on whatever ref the person picks, and the
# old one skipped the tag check on a branch and would still have published.
# A failed release is re-run from the tag's own run ("Re-run jobs"), which
# re-executes against the same tag.
#
#   verify -> test (3.11, 3.12, 3.13) -> build -> detection-baseline
#     -> provenance -> pypi -> image -> chart -> github-release
#        (these five run in the protected `release` environment)
#
# Nothing leaves this run -- attestation, package, image, chart or release --
# until the version check, the full test matrix, the build checks and the
# detection baseline against the built wheel pass on the tagged commit. The
# verify job also refuses a tag whose commit is not on main or whose CI run did
# not pass, and an IMAGE or CHART_REPOSITORY outside this repository's owner,
# which would otherwise fail only at the image job, after the PyPI upload. Every
# job that publishes runs in the `release` environment, so GitHub holds each
# one until a required reviewer approves it.
# For PyPI that is GitHub's rule, not this file's: the trusted publisher this
# expects names `release`, so PyPI refuses an upload from a job that did not
# run there, whichever commit's workflow ran it. GitHub creates a missing
# environment with no protection and lets administrators bypass one by
# default, so each of those jobs first runs
# .github/scripts/check-release-environment.sh, which fails unless `release`
# requires a reviewer that administrators cannot bypass. It reads the
# settings, not the approval. CONTRIBUTING.md, "Releasing", lists what has to
# be set on GitHub and PyPI.
#
# Each publish needs the one before it: a failed job stops everything after
# it. PyPI, the one upload that can never be replaced, goes before the
# registry pushes, so ghcr's X.Y and latest tags move only after it succeeded.
# A release that failed part-way is finished with "Re-run failed jobs" from
# the tag's run.
#
# There is deliberately NO moving major tag (v0, v1): during 0.x a minor
# release may break, so users pin a full commit SHA with a `# vX.Y.Z` comment,
# the way this repository pins its own actions.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Every run step runs as `bash --noprofile --norc -eo pipefail`. With no shell
# set, GitHub runs `bash -e`, where a pipeline exits with its last command's
# status: release.yml's `release_check.py versions | tee` passed a tag that
# did not match the tree. tests/test_workflows.py holds every run step to it.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/veridor-authz/veridor
  CHART_REPOSITORY: oci://ghcr.io/veridor-authz/charts

jobs:
  verify:
    name: One version everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      semver: ${{ steps.check.outputs.semver }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The image, the chart and the package metadata name this repository's owner
        run: python scripts/release_check.py owner --repository "$GITHUB_REPOSITORY" --image "$IMAGE" --chart-repository "$CHART_REPOSITORY"
      - name: The tagged commit is on main, and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-commit.sh
      - name: One version in every registered file, and it is the tag's
        id: check
        run: python scripts/release_check.py versions --tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: The CHANGELOG section for this version is release notes
        run: python scripts/release_check.py notes "$GITHUB_REF_NAME"

  test:
    name: Tests on the tagged commit (Python ${{ matrix.python-version }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      VERIDOR_REQUIRE_HELM: "1"
      VERIDOR_REQUIRE_KUBECTL: "1"
      VERIDOR_REQUIRE_SHELLCHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install helm v4.2.2 (sha256-checked)
        run: bash .github/scripts/install-helm.sh
      - name: Install shellcheck 0.11.0 (sha256-checked)
        run: bash .github/scripts/install-shellcheck.sh
      - name: Install kubectl v1.34.1 (sha256-checked)
        run: bash .github/scripts/install-kubectl.sh
      - run: python scripts/run_tests.py --tier fast
      - run: python scripts/run_tests.py --tier slow --jobs 4

  build:
    name: Build sdist, wheel, zipapp, checksums and SBOM
    needs: [verify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build with hash-pinned tools, then check what was built
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/build.txt
          python -m build --no-isolation --outdir dist .
          python scripts/build_zipapp.py --output-dir dist
          python scripts/release_check.py dist dist --tag "$GITHUB_REF_NAME" --require-zipapp
      - name: Smoke-test the wheel in a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --no-index --no-deps "dist/veridor-${VERSION}-py3-none-any.whl"
          cd "$(mktemp -d)"
          [[ "$("$RUNNER_TEMP/smoke/bin/veridor" --version)" == "veridor ${VERSION}" ]]
          [[ "$(python "$GITHUB_WORKSPACE/dist/veridor-${VERSION}.pyz" --version)" == "veridor ${VERSION}" ]]
      - name: Install the wheel into a directory for the SBOM scan
        run: python -m pip install --no-index --no-deps --target "$RUNNER_TEMP/sbom-root" "dist/veridor-${VERSION}-py3-none-any.whl"
      # syft runs after dist/ is built and before SHA256SUMS, provenance and
      # the PyPI upload, so it comes from the checked install, not from
      # anchore/sbom-action, which ran syft's install.sh with no digest pinned
      # here (tests/test_workflows.py, UNCHECKED_INSTALLERS).
      - name: Install syft v1.51.1 (sha256-checked)
        run: bash .github/scripts/install-syft.sh
      - name: CycloneDX SBOM of the installed wheel
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          syft scan "dir:$RUNNER_TEMP/sbom-root" --source-name veridor --source-version "$VERSION" \
            --output "cyclonedx-json=dist/veridor-${VERSION}.cdx.json"
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  detection-baseline:
    # Every pair in fixtures/pairs/ against the wheel this run built -- the
    # file PyPI is about to receive -- not the checkout. CI runs the same
    # pairs on every pull request and push to main, against src/; without this
    # job a release would publish a package the published-advisory baseline never
    # ran against. The venv holds the wheel and nothing else (--no-index
    # --no-deps). Under VERIDOR_TEST_AGAINST=installed, patched_pairs.py
    # prints which veridor it imports and refuses to start unless an installed
    # distribution's RECORD (here, the wheel's) lists that file and it is
    # outside src/. It pulls all twenty images by digest and builds the
    # Datasette pair from its pinned wheels: 2.42 GB compressed for
    # linux/amd64 (read from the registries, 2026-11-09). It publishes nothing;
    # provenance and pypi need it, so a wheel that no longer catches one of the
    # advisories' bugs is never attested or uploaded.
    name: Detection baseline against the built wheel (every pair)
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install the built wheel, and nothing else, into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/baseline-venv"
          "$RUNNER_TEMP/baseline-venv/bin/python" -m pip install --no-index --no-deps "dist/veridor-${VERSION}-py3-none-any.whl"
      - name: scripts/patched_pairs.py, every pair, against the installed wheel
        run: VERIDOR_TEST_AGAINST=installed "$RUNNER_TEMP/baseline-venv/bin/python" scripts/patched_pairs.py --pull

  provenance:
    name: Build provenance for the dist files
    needs: [build, detection-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release environment requires a reviewer, and administrators cannot bypass it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-environment.sh release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.pyz

  pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [verify, build, detection-baseline, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PyPI trusted publisher this expects names release.yml and
    # environment `release`, so PyPI accepts only an OIDC token whose
    # environment claim is `release`: one from a job GitHub held for the
    # reviewer. The provenance, image and chart jobs run there too and can
    # mint such a token.
    environment:
      name: release
      url: https://pypi.org/p/veridor
    permissions:
      contents: read
      actions: read
      # Trusted Publishing: PyPI checks this job's OIDC token, so no API token
      # exists to leak.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release environment requires a reviewer, and administrators cannot bypass it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-environment.sh release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Keep only what PyPI accepts (the zipapp, SBOM and checksums are release assets)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir pypi
          mv "dist/veridor-${VERSION}-py3-none-any.whl" "dist/veridor-${VERSION}.tar.gz" pypi/
      # The action uploads from a container it names by a tag,
      # ghcr.io/pypa/gh-action-pypi-publish:<the SHA below>, and that container
      # mints the PyPI token. The step before it pulls that image by digest and
      # tags it under that name, which the runner then runs without pulling;
      # the step after it fails the job if something else ran. When Dependabot
      # moves the SHA, re-resolve the digest (read-only):
      #   docker buildx imagetools inspect ghcr.io/pypa/gh-action-pypi-publish:<SHA>
      # Resolved 2026-09-24. tests/test_workflows.py holds both steps' tag to the SHA,
      # and their digest to the one its PUBLISH_DIGEST records for that SHA.
      - name: Pull the publish action's container by digest, under the tag it runs
        env:
          ACTION_IMAGE: ghcr.io/pypa/gh-action-pypi-publish
          ACTION_REF: dc37677b2e1c63e2034f94d8a5b11f265b73ba33
          ACTION_DIGEST: sha256:a68d05519f6d7e47372aeaddab80b851b69afa89be179ec41775c72c4e3ab2d5
        run: bash .github/scripts/pin-action-image.sh pin
      # No skip-existing, on purpose. "Re-run failed jobs" does not rebuild:
      # the build job succeeded, so the same dist artifact is uploaded again,
      # and PyPI answers 200 to a file whose name and hashes it already holds
      # (pypi/warehouse forklift/legacy.py, _is_duplicate_file; read, not run).
      # A file of the same name with different bytes is refused, and it
      # should be: skip-existing would skip it silently and the GitHub release
      # would carry files PyPI does not serve.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi/
      - name: The upload ran the container pinned by digest
        env:
          ACTION_IMAGE: ghcr.io/pypa/gh-action-pypi-publish
          ACTION_REF: dc37677b2e1c63e2034f94d8a5b11f265b73ba33
          ACTION_DIGEST: sha256:a68d05519f6d7e47372aeaddab80b851b69afa89be179ec41775c72c4e3ab2d5
        run: bash .github/scripts/pin-action-image.sh verify

  image:
    name: Container image (linux/amd64, linux/arm64), signed
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release environment requires a reviewer, and administrators cannot bypass it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-environment.sh release
      # Every image this job runs is pinned by digest, because the builder
      # produces what the job pushes and signs. Left to their defaults these
      # three actions run images by moving tag: binfmt (privileged), the
      # BuildKit builder (privileged) and the SBOM scanner. These are action
      # inputs, not `uses:` refs, so the github-actions Dependabot entry does
      # not cover them: re-resolve each with `docker buildx imagetools inspect`
      # when bumping. Digests resolved 2026-09-24.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags X.Y.Z and X.Y; latest only for a final release
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      # Nothing is pushed until each platform's image has started and run the
      # demo on this runner (arm64 under QEMU), compiling nothing from source.
      # Before, the release started no image: the arm64 variant ran in no
      # workflow, and scripts/image_bytecode_check.py ran only in CI, on
      # linux/amd64. These builds take the push's inputs and builder, so the
      # push below reuses their layers; the pushed digest is checked again
      # before it is signed.
      - name: Build linux/amd64 into the runner's image store
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: veridor:release-amd64
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      - name: Build linux/arm64 into the runner's image store
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: veridor:release-arm64
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      - name: Each platform's image starts and runs the demo, compiling nothing from source
        run: |
          python3 scripts/image_bytecode_check.py --platform linux/amd64 veridor:release-amd64
          python3 scripts/image_bytecode_check.py --platform linux/arm64 veridor:release-arm64
      - name: Build and push, with SBOM and max-mode provenance attached
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      - name: The pushed digest starts and runs the demo on each platform, before it is signed
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          python3 scripts/image_bytecode_check.py --platform linux/amd64 "${IMAGE}@${DIGEST}"
          python3 scripts/image_bytecode_check.py --platform linux/arm64 "${IMAGE}@${DIGEST}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    name: Helm chart to oci://ghcr.io/veridor-authz/charts, signed
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.chart.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release environment requires a reviewer, and administrators cannot bypass it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-environment.sh release
      - name: Install helm v4.2.2 (sha256-checked)
        run: bash .github/scripts/install-helm.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signed chart must deploy the image this run signed, not whatever
      # the X.Y.Z tag points at when a kubelet pulls it: the committed
      # values.yaml has image.digest "", so it is set here, and the packaged
      # chart is rendered to check it before anything is pushed.
      - name: Package with the image digest pinned, push and sign by digest
        id: chart
        env:
          SEMVER: ${{ needs.verify.outputs.semver }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the image job gave no digest ('${IMAGE_DIGEST}'), so the chart cannot pin one"
            exit 1
          fi
          chart=deploy/helm/veridor-gate
          python3 - "$chart/values.yaml" "$IMAGE_DIGEST" <<'PY'
          import sys
          path, digest = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          old = '\n  digest: ""\n'
          if text.count(old) != 1:
              sys.exit(f"::error::{path} has {text.count(old)} image.digest lines to set, expected 1")
          open(path, "w", encoding="utf-8").write(text.replace(old, f'\n  digest: "{digest}"\n'))
          PY
          helm package "$chart" --destination "$RUNNER_TEMP/chart"
          package="$RUNNER_TEMP/chart/veridor-gate-${SEMVER}.tgz"
          expected="${IMAGE}:${SEMVER}@${IMAGE_DIGEST}"
          rendered="$(helm template gate "$package" -f "$chart/ci/argocd-values.yaml" | sed -n 's/^ *image: "\(.*\)"$/\1/p')"
          if [[ "$rendered" != "$expected" ]]; then
            echo "::error::the packaged chart renders image '${rendered}', expected '${expected}'"
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "$package" "$CHART_REPOSITORY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in helm push output"; exit 1; }
          cosign sign --yes "${CHART_REPOSITORY#oci://}/veridor-gate@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  github-release:
    name: GitHub release with the CHANGELOG section as notes
    needs: [verify, build, provenance, pypi, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release environment requires a reviewer, and administrators cannot bypass it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-environment.sh release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # This job has no registry login, and that is the point of running it here:
      # every check above ran after one, so none could see a package users cannot
      # pull. It fails until the image and the chart are public, and both exist by
      # now, so a maintainer can set both and re-run this job (CONTRIBUTING.md,
      # "Releasing"). Not yet seen on GitHub.
      - name: The image and the chart can be read with no credential
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: python3 scripts/anonymous_pull_check.py "${IMAGE}@${DIGEST}" "${CHART_REPOSITORY#oci://}/veridor-gate@${CHART_DIGEST}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::missing digest: image '${DIGEST}', chart '${CHART_DIGEST}'"
            exit 1
          fi
          python3 scripts/release_check.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "Container image: \`${IMAGE}@${DIGEST}\` (cosign keyless signature)."
            echo "Helm chart: \`${CHART_REPOSITORY#oci://}/veridor-gate@${CHART_DIGEST}\` (cosign keyless"
            echo "signature). Its \`image.digest\` is the image digest above."
            # Pinned to this workflow at this tag: --repo alone accepts an
            # attestation from any workflow in the repository at any ref
            # (SECURITY.md, "Verifying a release").
            # Only the provenance job's subjects carry provenance; the SBOM and
            # SHA256SUMS are attached too and the command refuses them.
            echo "Verify a wheel, sdist or zipapp with"
            echo "\`gh attestation verify FILE --repo ${GITHUB_REPOSITORY} --cert-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}\`."
            echo "That accepts only provenance signed by release.yml running for this tag."
            echo "The SBOM and SHA256SUMS carry no provenance."
            echo "\`sha256sum --check --ignore-missing SHA256SUMS\` detects a damaged download, not a substituted one."
          } >> "$RUNNER_TEMP/notes.md"
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
