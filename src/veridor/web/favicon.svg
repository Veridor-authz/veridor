<!-- width/height are load-bearing, not redundant with viewBox: an SVG with only
     a viewBox has no intrinsic size, so `<img src="favicon.svg">` reports
     naturalWidth 0 and renders nothing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"
     role="img" aria-label="Veridor">
  <!-- veridor.org's mark: a shield and a tick on the site's dark plate. -->
  <rect width="32" height="32" rx="7" fill="#030710"/>
  <path d="M16 5l9 3.6v6.2c0 5.6-3.7 10.4-9 12.2-5.3-1.8-9-6.6-9-12.2V8.6L16 5z"
        fill="none" stroke="#7fc8ff" stroke-width="2.2"/>
  <path d="M11.5 16.2l3.1 3.1 6-6.2" fill="none" stroke="#7fc8ff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
