{{- include "veridor-gate.validate" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if eq .Values.hook.mode "argocd" }}
  # No name: Argo CD names each sync's Job from this prefix, so a sync never
  # reads the Job of the sync before it (_helpers.tpl, veridor-gate.jobName).
  generateName: {{ include "veridor-gate.argocdJobPrefix" . }}
  {{- else }}
  name: {{ include "veridor-gate.jobName" . }}
  {{- end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veridor-gate.labels" . | nindent 4 }}
    {{- with .Values.job.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if eq .Values.hook.mode "argocd" }}
    argocd.argoproj.io/hook: {{ include "veridor-gate.argoList" .Values.hook.argocd.phase | quote }}
    argocd.argoproj.io/hook-delete-policy: {{ include "veridor-gate.argoList" .Values.hook.argocd.deletePolicy | quote }}
    {{- with .Values.hook.argocd.syncWave | toString }}
    argocd.argoproj.io/sync-wave: {{ . | quote }}
    {{- end }}
    {{- else if eq .Values.hook.mode "helm" }}
    helm.sh/hook: {{ include "veridor-gate.helmList" .Values.hook.helm.events | quote }}
    helm.sh/hook-delete-policy: {{ include "veridor-gate.helmList" .Values.hook.helm.deletePolicy | quote }}
    helm.sh/hook-weight: {{ .Values.hook.helm.weight | toString | quote }}
    {{- end }}
    {{- with .Values.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Never retried. A retry turns an intermittent finding, or a probe the target
  # answered once, into a pass: the gate would report the luckiest attempt.
  backoffLimit: 0
  activeDeadlineSeconds: {{ int .Values.job.activeDeadlineSeconds }}
  {{- if not (kindIs "invalid" .Values.job.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ int .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "veridor-gate.selectorLabels" . | nindent 8 }}
        {{- with .Values.job.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.existingConfigMap.name }}
        checksum/config: {{ .Values.config | toJson | sha256sum }}
        {{- end }}
        {{- with .Values.job.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "veridor-gate.serviceAccountName" . }}
      # Veridor talks HTTP to the target and nothing else. It never calls the
      # Kubernetes API, so the pod gets no token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext.runAsUser }}
        runAsUser: {{ int . }}
        {{- end }}
        {{- with .Values.podSecurityContext.runAsGroup }}
        runAsGroup: {{ int . }}
        {{- end }}
        {{- with .Values.podSecurityContext.fsGroup }}
        fsGroup: {{ int . }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: veridor
          image: {{ include "veridor-gate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- range .Values.image.command }}
            - {{ . | quote }}
            {{- end }}
          args:
            {{- include "veridor-gate.args" . | nindent 12 }}
          # Credentials come only from Secrets. optional: true is deliberate: a
          # missing Secret or key leaves the variable unset and Veridor refuses
          # the configuration at once (exit 2, naming the variable). Marked
          # required, the pod would instead sit in CreateContainerConfigError
          # until activeDeadlineSeconds. Either way the Job fails.
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .key | quote }}
                  optional: true
            {{- end }}
          # The tail of the log becomes the termination message when the
          # container fails, so `kubectl describe` shows why without --logs.
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            {{- with .Values.podSecurityContext.runAsUser }}
            runAsUser: {{ int . }}
            {{- end }}
            {{- with .Values.podSecurityContext.runAsGroup }}
            runAsGroup: {{ int . }}
            {{- end }}
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "veridor-gate.configMapName" . }}
            items:
              - key: {{ include "veridor-gate.configMapKey" . }}
                path: veridor.json
        {{- if .Values.output.existingClaim }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ .Values.output.existingClaim }}
        {{- else }}
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.output.sizeLimit }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
