{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veridor-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veridor-gate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veridor-gate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rule: nothing connects to the gate.
  ingress: []
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.targetPeers | nindent 8 }}
      ports:
        {{- toYaml .Values.networkPolicy.targetPorts | nindent 8 }}
    {{- if .Values.networkPolicy.dns.enabled }}
    - to:
        {{- toYaml .Values.networkPolicy.dns.peers | nindent 8 }}
      ports:
        {{- toYaml .Values.networkPolicy.dns.ports | nindent 8 }}
    {{- end }}
{{- end }}
